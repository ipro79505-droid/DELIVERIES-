name: Inspect Android Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "ZIP FILE: $ZIP"
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Inspect project files
        run: |
          echo "===== ALL IMPORTANT FILES ====="
          find extracted -type f \( \
            -name "gradlew" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "gradle-wrapper.properties" \
            -o -name "AndroidManifest.xml" \
          \) -print

          echo "===== TOP LEVEL ====="
          find extracted -maxdepth 3 -type f | head -100
