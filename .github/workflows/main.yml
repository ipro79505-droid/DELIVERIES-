name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Find Android project
        run: |
          ROOT=$(find extracted -name "gradlew" -type f | head -1)
          ROOT=$(dirname "$ROOT")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Android project found at: $ROOT"

      - name: Make gradlew executable
        run: chmod +x "$ROOT/gradlew"

      - name: Build APK
        run: |
          cd "$ROOT"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            **/build/outputs/apk/**/*.apk
