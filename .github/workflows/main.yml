name: Inspect Gradle Files

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -1)
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - name: Inspect Gradle files
        run: |
          ROOT=$(dirname "$(find extracted -name settings.gradle.kts -type f | head -1)")

          echo "===== ROOT build.gradle.kts ====="
          cat "$ROOT/build.gradle.kts"

          echo "===== APP build.gradle.kts ====="
          cat "$ROOT/app/build.gradle.kts"

          echo "===== gradle.properties ====="
          cat "$ROOT/gradle.properties"

          echo "===== GRADLE DIRECTORY ====="
          find "$ROOT/gradle" -maxdepth 3 -type f -print 2>/dev/null || true
